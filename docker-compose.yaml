version: "3.8"

services:
  couchdb:
    image: couchdb:3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-passwordkuaman}
    volumes:
      - couchdb_data:/opt/couchdb/data
    ports:
      - "5984:5984"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5984/_up | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-ganti_secret_yang_aman}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COUCHDB_URL: http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD:-passwordkuaman}@couchdb:5984
      COUCHDB_RECORDS_DB: ${COUCHDB_RECORDS_DB:-simpus_records}
      COUCHDB_AUTH_DB: ${COUCHDB_AUTH_DB:-simpus_auth}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
        VITE_REMOTE_DB_URL: ${VITE_REMOTE_DB_URL:-}
        VITE_COUCHDB_URL: ${VITE_COUCHDB_URL:-http://localhost:5984}
        VITE_COUCHDB_DB_NAME: ${VITE_COUCHDB_DB_NAME:-simpus_records}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  couchdb_data:
